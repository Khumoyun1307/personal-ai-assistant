# Development stack (ARCHITECTURE §15.1). All Python tooling runs in `app`.
# Never run uv/python/pytest/alembic on the Windows host (AGENTS §4).

name: assistant-dev

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
    # Terse errors keep "DETAIL: Failing row contains ..." — i.e. message text —
    # out of the container log (ARCHITECTURE §14.4).
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
    volumes:
      # PostgreSQL 18+ images keep data in a major-version subdirectory, so the
      # mount goes at /var/lib/postgresql, not /var/lib/postgresql/data
      # (ARCHITECTURE §14.2; the same applies to the production bind mount).
      - db-data:/var/lib/postgresql
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Deliberately not published: the database is reached from `app` only.

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      # Inside the stack the database is always the `db` service.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://assistant:${POSTGRES_PASSWORD:-}@db:5432/assistant}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://assistant:${POSTGRES_PASSWORD:-}@db:5432/assistant_test}
    volumes:
      - .:/app
      - venv:/opt/venv
      - uv-cache:/root/.cache/uv
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 90s

volumes:
  db-data:
  venv:
  uv-cache:
