# Alembic configuration. Run via `just migrate` (never on the Windows host).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
path_separator = os
# The URL comes from DATABASE_URL via migrations/env.py; never put it here.
sqlalchemy.url =

[loggers]
keys = root,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
