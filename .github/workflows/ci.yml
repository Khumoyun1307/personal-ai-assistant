# Ready for when a GitHub remote exists (ARCHITECTURE §16). The local workflow
# (`just check`) does not depend on it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_PASSWORD: ci-local-password
  DATABASE_URL: postgresql+psycopg://postgres:ci-local-password@localhost:5432/assistant
  TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-local-password@localhost:5432/assistant_test

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci-local-password
          POSTGRES_DB: assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create the test database
        run: |
          PGPASSWORD=ci-local-password psql -h localhost -U postgres -d assistant \
            -c 'CREATE DATABASE assistant_test;'

      # The same terse logging as compose.dev.yml: a constraint violation's
      # DETAIL line quotes the failing row, i.e. message text (ARCHITECTURE
      # §14.4). A service container takes no command, so it is set live.
      - name: Terse Postgres error logging
        run: |
          PGPASSWORD=ci-local-password psql -h localhost -U postgres -d assistant -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET log_error_verbosity = 'terse';" \
            -c "ALTER SYSTEM SET log_min_error_statement = 'panic';" \
            -c "ALTER SYSTEM SET log_statement = 'none';" \
            -c "SELECT pg_reload_conf();"

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      - name: Layer contracts
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest

      # RG-10 on the database side: the test suite writes canary strings into
      # content columns and injects constraint violations; none of it may
      # appear in the Postgres container log.
      - name: Database log is content-free
        if: always()
        run: |
          docker logs "${{ job.services.db.id }}" > db.log 2>&1
          if grep -q "CANARY-SYNTH" db.log; then
            echo "::error::canary found in the Postgres log"; exit 1
          fi
          echo "db log: $(wc -l < db.log) lines, no canary"

      - name: Dependency audit
        run: uv run pip-audit
