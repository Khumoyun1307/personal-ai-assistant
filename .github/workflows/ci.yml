# Runs on every push to main and every pull request of
# github.com/Khumoyun1307/personal-ai-assistant (ARCHITECTURE §16). The local
# Definition-of-Done gate (`just check`) mirrors the `lint` and `tests` jobs; the deploy
# jobs mirror `just smoke-backup` and the arm64 builds for the Oracle A1 host.
name: CI

# Documentation-only changes skip CI (owner decision 2026-10-26, AGENTS §11).
# No test reads these files; prompt and rubric .md files under src/ and evals/
# are code and still trigger it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "deploy/runbooks/**"
      - "tools/**/*.md"
      - "evals/README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "deploy/runbooks/**"
      - "tools/**/*.md"
      - "evals/README.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_PASSWORD: ci-local-password
  DATABASE_URL: postgresql+psycopg://postgres:ci-local-password@localhost:5432/assistant
  TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-local-password@localhost:5432/assistant_test

jobs:
  # Lint, types, layer contracts and the dependency audit: once, no database.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src evals

      - name: Layer contracts
        run: uv run lint-imports

      - name: Dependency audit
        run: uv run pip-audit

  # The full test suite in three parallel jobs, each with its own PostgreSQL
  # (owner, 2026-10-27). `tools/ci/split_tests.py` gives each job its files;
  # tests/unit/test_ci_split.py checks that every file runs exactly once.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci-local-password
          POSTGRES_DB: assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create the test database
        run: |
          PGPASSWORD=ci-local-password psql -h localhost -U postgres -d assistant \
            -c 'CREATE DATABASE assistant_test;'

      # The same terse logging as compose.dev.yml: a constraint violation's
      # DETAIL line quotes the failing row, i.e. message text (ARCHITECTURE
      # §14.4). A service container takes no command, so it is set live.
      - name: Terse Postgres error logging
        run: |
          PGPASSWORD=ci-local-password psql -h localhost -U postgres -d assistant -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET log_error_verbosity = 'terse';" \
            -c "ALTER SYSTEM SET log_min_error_statement = 'panic';" \
            -c "ALTER SYSTEM SET log_statement = 'none';" \
            -c "SELECT pg_reload_conf();"

      - name: Tests (shard ${{ matrix.shard }} of 3)
        run: uv run pytest $(uv run python tools/ci/split_tests.py --shards 3 --index ${{ matrix.shard }})

      # RG-10 on the database side: the test suite writes canary strings into
      # content columns and injects constraint violations; none of it may
      # appear in the Postgres container log.
      - name: Database log is content-free
        if: always()
        run: |
          docker logs "${{ job.services.db.id }}" > db.log 2>&1
          if grep -q "CANARY-SYNTH" db.log; then
            echo "::error::canary found in the Postgres log"; exit 1
          fi
          echo "db log: $(wc -l < db.log) lines, no canary"

  # One result for the whole gate (the name `check` is what PRs show).
  check:
    if: always()
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Lint and every test shard passed
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.tests.result }}" = success

  # Deployment scripts and the backup path of deploy/compose.prod.yml (S02.6).
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 \
            -x -P SCRIPTDIR $(git ls-files '*.sh') .githooks/pre-commit

      # Production compose with placeholder secrets: backup.sh once, decrypt
      # with a throwaway age key, pg_restore into a scratch database, failure
      # and off-site sync semantics. Uses the default Docker builder, so it
      # runs in its own job (buildx below switches builders).
      - name: Backup smoke test
        run: bash deploy/smoke/backup-smoke.sh

  # The production host is an Oracle A1 (arm64) VM; prove both images build
  # for it as well as for amd64. Nothing is pushed (no registry).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: App image (prod target), amd64 + arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Backup image, amd64 + arm64
        uses: docker/build-push-action@v7
        with:
          context: deploy/backup
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
