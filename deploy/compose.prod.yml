# Production (personal) deployment — ARCHITECTURE §15.4, §14.2.
#
#   docker compose --env-file .env -f deploy/compose.prod.yml up -d --build
#
# Run from the repository root on the server (/opt/assistant). Secrets come
# from the server's .env (written by deploy/oci/push-env.sh, mode 600).
# `--env-file .env` is required on every invocation: Compose's project
# directory is deploy/ (the first -f file's directory), so without it the
# ${...} interpolation below would look for deploy/.env and find nothing.
# The `env_file:` entries load the same file into the containers; the
# `environment:` entries below only add values derived from it (never a
# pass-through that could override a value with an empty string).
# The database directory is a bind mount on the encrypted block volume;
# nothing publishes a port — long polling needs no inbound traffic.

name: assistant-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
    # Terse errors keep "DETAIL: Failing row contains ..." (message text) out
    # of the container log (ARCHITECTURE §14.4) — identical to compose.dev.yml.
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
    volumes:
      # PostgreSQL 18 images keep data in a major-version subdirectory, so the
      # mount goes at /var/lib/postgresql (M00 F1). DATA_DIR must be on the
      # encrypted block volume (runbooks/provision.md verifies it).
      # Long syntax with create_host_path: false — the short syntax would
      # create a missing source, so an unmounted volume would give Postgres
      # an empty directory on the boot disk to initialise a new, empty
      # cluster in (migrate would build the schema, the app would consume
      # Telegram's queued updates into it, and backups of it would rotate
      # the real dumps out). Both sources live on the volume only: without
      # it, the container cannot be created or started.
      - type: bind
        source: ${DATA_DIR:?set DATA_DIR in .env (a directory on the encrypted volume)}/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
      # Written by bootstrap-host.sh on the volume (§15.4 mount guard).
      - type: bind
        source: ${DATA_DIR:?set DATA_DIR in .env (a directory on the encrypted volume)}/.alviro-data-volume
        target: /etc/alviro-data-volume
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assistant} -d ${POSTGRES_DB:-assistant}"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *logging

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: prod
    image: assistant:prod
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-assistant}
    command: ["python", "-m", "assistant", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  app:
    image: assistant:prod
    env_file: ../.env
    environment:
      APP_ENV: prod
      LOG_FORMAT: json
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-assistant}
      # The backup container writes its last-success marker here; the app's
      # daily backup_check alerts the owner when it goes stale (§17).
      # The off-site upload marker (/backups/last_upload_success) sits next to
      # it and is checked too while BACKUP_REMOTE (from .env) is set.
      BACKUP_STATUS_PATH: /backups/last_success
    command: ["python", "-m", "assistant", "run"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # The backup container creates the shared volume first, so it is
      # initialised from the backup image (owned by postgres, writable).
      backup:
        condition: service_started
    restart: unless-stopped
    # Inside Compose's grace period: workers finish in-flight sends (§4.3).
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-m", "assistant", "healthcheck"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    volumes:
      - backups:/backups:ro
    logging: *logging

  backup:
    build:
      # The Dockerfile COPYs backup.sh and restore.sh from its own directory.
      context: ./backup
      dockerfile: Dockerfile
    image: assistant-backup:prod
    # AGE_RECIPIENT, BACKUP_REMOTE, BACKUP_HOUR_UTC and RCLONE_CONFIG_* come
    # from here unchanged.
    env_file: ../.env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-assistant}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-assistant}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - backups:/backups
    logging: *logging

volumes:
  backups:
