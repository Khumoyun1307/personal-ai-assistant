#cloud-config
# First-boot hardening of the production host (Ubuntu 24.04 aarch64 on OCI).
# Rendered by deploy/oci/provision.sh, which replaces __DEPLOY_SSH_KEY__ with
# the agent's public key (var/cloud/ssh/id_ed25519.pub). Nothing secret here.
# cloud-init docs: https://cloudinit.readthedocs.io/en/latest/reference/modules.html

users:
  - default
  - name: deploy
    gecos: Alviro deploy
    shell: /bin/bash
    groups: [sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - __DEPLOY_SSH_KEY__

# SSH keys only, no root login.
disable_root: true
ssh_pwauth: false

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - chrony
  - fail2ban
  - unattended-upgrades

write_files:
  - path: /etc/ssh/sshd_config.d/60-alviro.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
  # Security updates install automatically; the host never reboots on its own
  # (a reboot is a planned, checked step — runbooks/deploy.md).
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/apt/apt.conf.d/52alviro-unattended
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
  # OCI's link-local NTP service, in addition to Ubuntu's pool.
  - path: /etc/chrony/conf.d/oci.conf
    permissions: "0644"
    content: |
      server 169.254.169.254 iburst
  - path: /etc/fail2ban/jail.d/alviro.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
  # Container logs are capped (the app log is content-free; ARCHITECTURE §14.4).
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {"log-driver": "json-file", "log-opts": {"max-size": "20m", "max-file": "5"}}

runcmd:
  # Oracle's Ubuntu images ship iptables-persistent rules that reject all
  # inbound traffic except SSH and all forwarded traffic (which breaks
  # container networking). ufw replaces them: ufw "Breaks" both packages, so
  # they are purged first, and the loaded rules are flushed before ufw is
  # enabled. The OCI security list still admits only TCP 22 meanwhile.
  - [sh, -c, "DEBIAN_FRONTEND=noninteractive apt-get purge -y iptables-persistent netfilter-persistent || true"]
  - [sh, -c, "iptables -F INPUT && iptables -F FORWARD && ip6tables -F INPUT && ip6tables -F FORWARD"]
  - [sh, -c, "DEBIAN_FRONTEND=noninteractive apt-get install -y ufw"]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, OpenSSH]
  - [ufw, --force, enable]
  # Docker Engine + Compose plugin from Docker's apt repository
  # (https://docs.docker.com/engine/install/ubuntu/).
  - [install, -m, "0755", -d, /etc/apt/keyrings]
  - [curl, -fsSL, "https://download.docker.com/linux/ubuntu/gpg", -o, /etc/apt/keyrings/docker.asc]
  - [chmod, a+r, /etc/apt/keyrings/docker.asc]
  - - sh
    - -c
    - |
      . /etc/os-release
      printf 'Types: deb\nURIs: https://download.docker.com/linux/ubuntu\nSuites: %s\nComponents: stable\nArchitectures: %s\nSigned-By: /etc/apt/keyrings/docker.asc\n' \
        "${UBUNTU_CODENAME:-$VERSION_CODENAME}" "$(dpkg --print-architecture)" > /etc/apt/sources.list.d/docker.sources
  - [sh, -c, "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"]
  - [usermod, -aG, docker, deploy]
  - [systemctl, enable, --now, docker, chrony, fail2ban, unattended-upgrades]
  - [systemctl, restart, chrony]
  - [systemctl, restart, ssh]
  - [touch, /var/lib/alviro-cloud-init-done]
